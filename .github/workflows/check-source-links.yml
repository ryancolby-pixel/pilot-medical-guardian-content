name: Check FAA source links

# Weekly check that every FAA source the app and the website cite still resolves.
#
# WHY. On 2026-08-07 three cited URLs turned out to be 404, covering 176 of the 622
# reference entries the app ships. They had rotted silently when the FAA reorganised its
# site. Nothing noticed, because nothing was looking: the two existing watchers track
# whether specific FAA PDFs have been REISSUED (by SHA), and the app repo's drift check
# tracks whether the CDN and the bundle agree. Neither asks whether the thing we point a
# pilot at is still there.
#
# That matters more than a normal broken link. The app's promise, and the FAQ answer
# published the same morning, is that where it describes an FAA rule in its own words it
# names the document and links straight to it so a pilot can read the original. A dead
# link makes that promise hollow.
#
# Runs Monday at 15:00 UTC, an hour after the CACI PDF check and two after the HIMS one,
# so the three do not hit faa.gov at once.

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch: {}
  # No push trigger, deliberately. A branch-filtered push trigger makes GitHub send a
  # "Run failed: No jobs were run" email every time this file lands on a non-default
  # branch. One of those hit Ryan's inbox on 2026-08-07 from a different workflow, and a
  # false alarm is the fastest way to teach someone to ignore a real one.

permissions:
  contents: read
  issues: write

env:
  # Push half of the alerting. The issue/PR is the durable QUEUE; this is what
  # actually REACHES Ryan, who receives no GitHub notifications. Fail-soft: if
  # these are unset the script warns and exits 0, so a missing secret can never
  # suppress the issue or PR that does work.
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the content
        uses: actions/checkout@v5

      - name: Check every cited FAA source
        id: check
        run: |
          set +e
          python3 scripts/check-source-links.py | tee link-output.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Exit 2 means the runner could not reach anything at all (DNS, TLS, network). That
      # is a problem with this job, not with the citations, and filing an issue saying
      # every FAA source has vanished would be worse than saying nothing.
      - name: Note an unreachable run
        if: steps.check.outputs.code == '2'
        run: |
          echo "::warning title=Could not check the source links::The runner could not reach any of the cited URLs. Not a content problem. See the log."

      # NOTIFY ON CHANGE, NOT ON STATE. A known unfixed problem should not re-email every
      # Monday: that is how an alert teaches its reader to ignore it, which is the failure
      # mode this whole exercise was about. The issue stays OPEN as the visible record, and
      # a fingerprint of exactly which URLs are dead is embedded in it. We only speak up
      # when that set CHANGES, or when it clears.
      - name: Report only if the set of dead links changed
        if: steps.check.outputs.code == '1'
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create faa-link-rot --color d93f0b             --description "A cited FAA source no longer resolves" 2>/dev/null || true
          FP=$(cat source-link-fingerprint.txt)
          EXISTING=$(gh issue list --state open --label faa-link-rot --author 'github-actions[bot]' --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            PREV=$(gh issue view "$EXISTING" --json body --jq '.body' | grep -o 'fingerprint:[a-f0-9]*' | head -1 | cut -d: -f2)
            if [ "$PREV" = "$FP" ]; then
              echo "same dead links as issue #$EXISTING already reports. Staying quiet."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh issue comment "$EXISTING" --body-file source-link-report.md
            ./scripts/send-alert-email.sh "PMG: a cited FAA source no longer resolves" source-link-report.md
            gh issue edit "$EXISTING" --body-file source-link-report.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            gh issue create               --title "A cited FAA source no longer resolves"               --label faa-link-rot               --assignee ryancolby-pixel               --body-file source-link-report.md
            # 🚨 ADDED 2026-08-17. This branch is the FIRST-EVER dead link, and it was the
            # one path that did not send the alert email - so the very first rot went out
            # with no push notification while every SUBSEQUENT change got one. Its sibling
            # check-source-freshness.yml had the mirror-image gap (email on create, none on
            # change). check-med-claims.yml, written a month later, calls it on both, which
            # is what shows these two were drift rather than a decision.
            ./scripts/send-alert-email.sh "PMG: a cited FAA source no longer resolves" source-link-report.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Everything resolves again. Close the record, once, rather than leaving a stale
      # open issue that quietly stops meaning anything.
      - name: Close the issue when every source resolves again
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --label faa-link-rot --author 'github-actions[bot]' --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All cited FAA sources resolve again as of $(date -u +%Y-%m-%dT%H:%MZ). Closing."
          fi

      # Fails only when the dead set CHANGED. A red run emails the owner, which is right
      # for new rot and wrong for a problem already filed and still being worked. When the
      # set is unchanged the run is green and the OPEN ISSUE carries the truth, so nothing
      # is hidden: it is recorded in the one place that is actually actionable.
      - name: Fail the run when new rot appears, so the owner is emailed
        if: steps.check.outputs.code == '1' && steps.notify.outputs.changed == 'true'
        run: |
          echo "The set of dead FAA sources changed. See the issue above."
          exit 1
