name: Watchdog - are the safeguards actually running

# WHY THIS EXISTS, and it is the least obvious of the checks.
#
# On 2026-07-11 Ryan asked for automated drift alerting. It was built the same day. It
# then did not run once for 27 days, for three independent reasons that each concealed
# the next: it lived on a branch where a cron trigger cannot fire, its activation was
# gated behind an App Review that never came, and its YAML was unparseable. Nobody
# noticed, because a workflow that never runs produces no output to notice. It looked
# like insurance the whole time and provided none.
#
# A safeguard that has never executed is not a safeguard. This is the thing that watches
# for that: it asks whether each scheduled workflow has actually run recently, and says
# so if one has gone quiet. It is deliberately the simplest job here, because a watchdog
# that is itself elaborate is just one more thing that can silently stop.
#
# It cannot watch itself. That is unavoidable and worth stating: if this job disappears,
# nothing will say so. Its own last-run time is visible on the Actions tab.

on:
  schedule:
    - cron: "30 15 * * 1"   # Monday, after the three FAA checks have had their turn
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

env:
  # Push half of the alerting. The issue/PR is the durable QUEUE; this is what
  # actually REACHES Ryan, who receives no GitHub notifications. Fail-soft: if
  # these are unset the script warns and exits 0, so a missing secret can never
  # suppress the issue or PR that does work.
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Check every scheduled workflow has run recently
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check-watchdog.py | tee watchdog-output.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report a silent safeguard
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create silent-safeguard --color 5319e7 \
            --description "A scheduled check has stopped running" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label silent-safeguard --author 'github-actions[bot]' --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file watchdog-report.md
          else
            gh issue create \
              --title "A scheduled safeguard has stopped running" \
              --label silent-safeguard \
              --assignee ryancolby-pixel \
              --body-file watchdog-report.md
            ./scripts/send-alert-email.sh "PMG: a scheduled safeguard has stopped running" watchdog-report.md
          fi
          exit 1

      # 🚨 ADDED 2026-08-17. This was the semantically worst of the three missing close
      # steps: an issue titled "A scheduled safeguard has stopped running" would have
      # survived the safeguard resuming, so the one job whose entire purpose is to notice
      # that something quietly stopped would itself have gone on asserting a fault that
      # had been fixed. A watchdog that cannot stand down is a watchdog you learn to mute.
      #
      # ⚖️ NOTE the deliberate asymmetry with its siblings: the alert email is sent ONLY on
      # the create branch above and is NOT added to the comment branch. This job has no
      # fingerprint, so its comment branch fires on STATE rather than on CHANGE - emailing
      # there would mail Ryan every Monday for as long as a safeguard stayed quiet, which
      # is the precise antipattern the other checkers were written to avoid.
      - name: Close the issue once every safeguard is running again
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --label silent-safeguard --author 'github-actions[bot]' --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Every scheduled safeguard has run inside its expected window as of $(date -u +%Y-%m-%dT%H:%MZ). Closing."
          fi
