# Deploy the site to GitHub Pages via Actions.
#
# WHY THIS EXISTS (2026-08-06): the LEGACY Pages builder broke for this site and
# would not recover. Four consecutive deploys failed, each running almost exactly
# 10 minutes and reporting only the generic "Page build failed":
#
#   0627d82  auto-build on push   errored
#   0627d82  manual re-run        errored
#   0627d82  API rebuild request  errored
#   4cb9201  EMPTY commit         errored   <- changes zero files
#
# The empty commit is what settles it. Ruled out with evidence, not assumption:
# the content (21 lines of printable ASCII, no Liquid, and .nojekyll means Jekyll
# never runs), repo size (70 files, 10MB, against a 1GB limit), a GitHub-wide
# incident (Pages and Actions both reported operational), workflow interference
# (nothing else here touches Pages), an approval gate (deployments reach
# in_progress within 2 seconds), symlinks, odd filenames, and submodules.
#
# The legacy builder is deprecated. This moves deployment onto Actions, which
# does not use it at all.
#
# NOTE: the artifact is the whole repo root, so CNAME (the custom domain
# pilotmedicalguardian.com) and .nojekyll are included. Do not narrow the upload
# path without carrying both across, or the custom domain drops.

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ACTION VERSIONS ARE LOAD-BEARING HERE. GitHub runners switched to Node 24 by
# default on 2026-06-16. The v3/v4/v5-era actions target Node 20 and get FORCE-RUN
# on Node 24, and under that the deploy step hangs and dies at the 10 minute
# timeout. That is what broke this site's deploys on 2026-08-06, and it hit the
# legacy "pages build and deployment" pipeline too, because that is itself an
# Actions workflow using actions/deploy-pages internally. Same action, same hang,
# which is why BOTH pipelines failed identically including on an empty commit.
# Keep these on current majors. Do not pin them back.

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Stage a CLEAN copy rather than uploading the repo root. Uploading "." sweeps in
      # .git (about 20MB) and .github, which do not belong in a published site.
      # CNAME and .nojekyll MUST be copied across: CNAME holds the custom domain
      # pilotmedicalguardian.com, and without .nojekyll GitHub would run Jekyll over
      # the site. Losing either one breaks the published site.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          test -f _site/CNAME || { echo "CNAME missing from the artifact, refusing to deploy"; exit 1; }
          test -f _site/.nojekyll || { echo ".nojekyll missing from the artifact, refusing to deploy"; exit 1; }
          echo "staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
