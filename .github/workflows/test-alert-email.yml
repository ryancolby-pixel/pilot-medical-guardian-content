# TEMPORARY. Exists only to prove the alert email path works end to end, then is deleted.
# Run manually from the Actions tab; it is never scheduled and never runs on push.
name: TEMP - test the alert email

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the secrets are present without printing them
        run: ./scripts/check-alert-secrets.sh

      - name: Send a test alert
        run: |
          ./scripts/write-test-alert-body.sh > test-alert-body.md
          ./scripts/send-alert-email.sh "PMG: test alert - the FAA safeguards can reach you" test-alert-body.md
