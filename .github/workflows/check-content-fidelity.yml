name: Content fidelity check

# Does what we SAY match what the cited FAA source SAYS?
#
# The three checks that existed before this one ask whether a page is REACHABLE
# (check-source-links), whether it CHANGED (check-source-freshness), and whether our two
# copies MATCH (check-cdn-drift). All three passed every week while 89 defects sat in
# si_requirements.json, nine of them able to send a pilot into an FAA exam expecting a
# certificate where the AME Guide directs a deferral. None of them asks whether our
# sentence says what the FAA's sentence says. This one does.
#
# See scripts/check-content-fidelity.py for the full account.

on:
  schedule:
    - cron: "0 14 * * 1"     # Mondays 14:00 UTC. This is the EARLIEST of the weekly
                             # content checks apart from the CACI PDF job, which shares
                             # this slot: links 15:00, re-verification 15:23, watchdog
                             # 15:30, freshness and med-claims 16:00. (Corrected 8/17 --
                             # it previously claimed to run "after the other weekly
                             # content checks", which was backwards.)
  workflow_dispatch: {}
  # ✅ PUSH TRIGGER RESTORED 2026-08-17, after the calibration it was disabled for.
  #
  # It was turned off on 2026-08-14 because it emailed Ryan four times in one afternoon
  # and not one was a content defect - all three causes were calibration errors: a
  # baseline banked before the numeric check existed, a readability control that tested
  # for the string "faa" (which "Federal Aviation Administration" does not contain), and
  # eCFR serving a JavaScript shell to datacenter IPs so five present quotations read as
  # missing on the runner while passing locally.
  #
  # What changed: the eCFR fetch goes through the renderer API, so runner and laptop now
  # agree. Quote resolution understands that `envelope.sourceURL` is single-valued while
  # entries legitimately quote several FAA documents, which was the cause of the 120
  # findings on the 8/17 scheduled run - every one of them correctly-attributed content.
  # The baseline was rebanked from a clean full pass and SHRANK, 279 -> 207. Local run is
  # green at new: 0.
  #
  # ⚠️ HONEST CAVEAT: no CI run has gone green yet, because no run has FIRED since the fix
  # landed - this trigger is path-scoped to v1/** and the fix touched only scripts/.
  #
  # 🚨 THE SENTENCE THAT USED TO BE HERE WAS FALSE, and it is worth keeping the correction
  # visible. It said the last scheduled run "failed in Set up job before our steps ran",
  # blaming the GitHub Actions outage. Measured on run 32038935824: Set up job, checkout,
  # setup-python, the pdfplumber install, the check itself AND the issue-comment step all
  # succeeded; the only failing step was the deliberate `Fail the run`. The run executed
  # completely and went red for the 120 findings, which is exactly what the paragraph
  # above says. The "Set up job" failure was the PAGES deploy, a different workflow, and
  # the two were conflated while writing this. The block contradicted itself eleven lines
  # apart and nobody noticed until the alerting layer was audited.
  #
  # The standing rule still applies and is the safety net - if this cries wolf, turn it
  # off at the SECOND false alarm, not the fourth.
  #
  # ⏱️ PATH-SCOPED ON PURPOSE. The check reads a ~189-document corpus and takes about 25
  # minutes on a cold runner. Firing it on a docs or script push spends that for nothing,
  # so it runs when the CONTENT it checks actually changes.
  push:
    paths:
      - "v1/**"

permissions:
  contents: read
  issues: write

jobs:
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdfplumber
        run: pip install --quiet pdfplumber

      # 🚨 GATE THE CHECKER ON ITS OWN CONTROLS BEFORE TRUSTING ITS VERDICT (2026-08-24).
      # Added after it filed issue #8 against FAA content that had not changed: the baseline
      # key contained the sourceURL, so correcting two PDF filenames to the casing the FAA
      # now redirects to resurrected two long-banked findings as "new" - while reporting the
      # very same findings as "resolved" in the same run. This mirrors the gate already on
      # check-source-links.yml, and for the same reason: the sibling checker cried wolf on
      # 2026-08-24 too, and a false alarm about FAA content is the most expensive kind this
      # repo can produce. The selftest asserts BOTH directions - a corrected URL stays
      # suppressed, and a changed count, a changed code or a key that merges live baseline
      # entries all still fail.
      - name: Selftest the baseline key
        run: python3 scripts/check-content-fidelity.py --selftest

      # NOTE: the whole body lives in scripts/check-content-fidelity.py on purpose. An
      # unindented continuation line inside a `run: |` block terminates the YAML scalar and
      # makes the workflow unparseable, which is what left cdn-drift-check.yml dead from the
      # day it was written until 2026-08-07, and then again on a feature branch for six days.
      - name: Check content against its cited FAA sources
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/check-content-fidelity.py | tee fidelity-output.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open / update the fidelity issue
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create content-fidelity --color b60205 \
            --description "Published content does not match the FAA source it cites" 2>/dev/null || true
          {
            echo "A quoted span or numeric claim in published content does not appear in the FAA source it cites, as of $(date -u +%Y-%m-%dT%H:%MZ)."
            echo
            cat content-fidelity-report.md 2>/dev/null || cat fidelity-output.txt
          } > fidelity-comment.md
          EXISTING=$(gh issue list --state open --label content-fidelity --author 'github-actions[bot]' --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file fidelity-comment.md
          else
            gh issue create \
              --title "Published content does not match its cited FAA source" \
              --label content-fidelity \
              --body-file fidelity-comment.md
          fi

      # 🚨 ADDED 2026-08-17. Without this the issue could never close by any code path in
      # the repo, and that was not theoretical: the 8/15 green run left issue #6 open,
      # asserting that published content misquotes the FAA, while the check that filed it
      # was passing. The only signal that content had gone clean was the ABSENCE of a new
      # comment, which is indistinguishable from the workflow having silently stopped -
      # the exact 27-day failure mode watchdog.yml exists to catch. Its three older
      # siblings all close; this one and check-verification-age.yml were written from a
      # simpler template two days later and both missed it.
      - name: Close the issue when every cited span checks out again
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXISTING=$(gh issue list --state open --label content-fidelity --author 'github-actions[bot]' --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Every quoted span and numeric claim resolves against the source it cites as of $(date -u +%Y-%m-%dT%H:%MZ). Closing."
          fi

      - name: Fail the run
        if: steps.check.outputs.code != '0'
        run: |
          echo "Content fidelity check failed, or a cited source could not be read. See the issue above."
          exit 1
