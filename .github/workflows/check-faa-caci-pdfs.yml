name: Check FAA CACI Worksheet PDFs for reissue

# Polls every FAA CACI Worksheet PDF weekly. When any PDF's SHA changes
# (FAA reissues a worksheet -- typically tied to an AME Guide update or a
# specific worksheet revision), opens a PR listing which worksheets
# changed. The maintainer downloads the new PDFs, drops them into
# /Users/ryan/pilot-medical-guardian/PilotMedicalGuardian/Reference/
# BundledContent/CACIWorksheets/, bumps the manifest, ships.
#
# Tracked list lives in .faa-caci-pdf-shas. When the FAA adds a new CACI
# condition (rare), update that file and the app's CACIWorksheet entries.
#
# 2026-08-07: broadened past CACI. A coverage check while building
# check-source-freshness.py found we cited 34 FAA PDFs and watched only 29
# of them. The 4 unwatched ones were AASI_Sleep_Apnea_OSA.pdf,
# Stroke-CVA-TIA.pdf, Seizures_Epilepsy.pdf and Head-Injury.pdf -- all under
# the same /ame_guide/media/ path, so they cost nothing to add. Notably the
# OSA one is the source of a live content error found the same morning (we
# asked for a 30-day PAP report where the FAA asks for the cumulative
# annual one), so it was the single worst PDF to have unwatched.
# The job name still says CACI; what it actually watches is "every FAA PDF
# we cite", which is the useful definition.
#
# hims-ames.pdf is deliberately NOT here: check-faa-hims-pdf.yml owns it.

on:
  schedule:
    - cron: "0 14 * * 1"   # every Monday at 14:00 UTC (≈ 10 AM ET, an hour after HIMS check)
  workflow_dispatch: {}    # also runnable on-demand

permissions:
  contents: write
  pull-requests: write

env:
  # Push half of the alerting. The issue/PR is the durable QUEUE; this is what
  # actually REACHES Ryan, who receives no GitHub notifications. Fail-soft: if
  # these are unset the script warns and exits 0, so a missing secret can never
  # suppress the PR that does work.
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
  TRACK_FILE: .faa-caci-pdf-shas
  BRANCH_PREFIX: faa-caci-pdfs

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every FAA PDF we cite
        run: |
          set -euo pipefail
          mkdir -p /tmp/caci_check
          UA="pilot-medical-guardian-content/1.0 (+https://github.com/ryancolby-pixel/pilot-medical-guardian-content)"
          while read line; do
            fname=$(echo "$line" | awk '{print $2}')
            url="https://www.faa.gov/ame_guide/media/$fname"
            if curl -sS -L --fail --max-time 60 -A "$UA" -o "/tmp/caci_check/$fname" "$url"; then
              echo "  ✓ $fname"
            else
              echo "  ✗ FAILED $fname ($url)"
              exit 1
            fi
          done < "$TRACK_FILE"
          ls -la /tmp/caci_check/ | tail -5

      - name: Compare SHAs against tracked values
        id: cmp
        run: |
          set -euo pipefail
          CHANGED_LIST=""
          CHANGE_COUNT=0
          # Build a new SHA file in /tmp and diff against tracked.
          : > /tmp/caci_new_shas
          while read line; do
            fname=$(echo "$line" | awk '{print $2}')
            old_sha=$(echo "$line" | awk '{print $1}')
            new_sha=$(shasum -a 256 "/tmp/caci_check/$fname" | awk '{print $1}')
            echo "$new_sha  $fname" >> /tmp/caci_new_shas
            if [ "$new_sha" != "$old_sha" ]; then
              CHANGED_LIST="$CHANGED_LIST $fname"
              CHANGE_COUNT=$((CHANGE_COUNT + 1))
            fi
          done < "$TRACK_FILE"
          echo "change_count=$CHANGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "changed_list=$CHANGED_LIST" >> "$GITHUB_OUTPUT"
          if [ $CHANGE_COUNT -eq 0 ]; then
            echo "✅ All 29 PDFs unchanged"
          else
            echo "ℹ️ $CHANGE_COUNT PDFs changed:$CHANGED_LIST"
            cp /tmp/caci_new_shas "$TRACK_FILE"
          fi

      - name: Open PR with updated SHAs
        if: steps.cmp.outputs.change_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT:    ${{ steps.cmp.outputs.change_count }}
          CHANGED:  ${{ steps.cmp.outputs.changed_list }}
        run: |
          set -euo pipefail
          # 🚨 BRANCH KEYED ON CONTENT, NOT ON THE CLOCK (2026-08-17). It was
          # "${BRANCH_PREFIX}-$(date +%Y%m%d-%H%M%S)", so every weekly run that still saw a
          # SHA mismatch produced a BRAND-NEW branch, a brand-new PR and a brand-new email
          # for the same unmerged reissue. Its sibling check-faa-hims-pdf.yml keys on the
          # SHA and guards with `gh pr list --head`; this one had neither. Latent so far
          # only because CACI has never yet detected a reissue, but the 14-day-old open
          # HIMS PR is the evidence that merges are not always prompt.
          STAMP=$(printf '%s' "$CHANGED" | shasum -a 256 | cut -c1-8)
          BRANCH="${BRANCH_PREFIX}-${STAMP}"
          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR is already open for this exact set of changed worksheets - skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$TRACK_FILE"
          git commit -m "FAA CACI: $COUNT worksheet(s) changed at upstream (auto-detected)"
          git push -u origin "$BRANCH"

          # Build the PR body
          BODY=$(cat <<EOF
          The FAA has reissued **$COUNT** CACI worksheet PDF(s) since the last check.

          Changed:
          $(echo "$CHANGED" | tr ' ' '\n' | grep -v '^$' | sed 's/^/- /')

          ### Maintainer action

          For each changed PDF, download the new version from
          \`https://www.faa.gov/ame_guide/media/<filename>\` and replace the
          corresponding file in the app repo at
          \`PilotMedicalGuardian/Reference/BundledContent/CACIWorksheets/\`.
          Then bump the content manifest and ship a content release.

          Worksheets without structural changes (typo fixes, date refreshes)
          can ship as-is. Worksheets with new criteria or eligibility changes
          should be reviewed by the AME advisor before publication.
          EOF
          )
          gh pr create \
            --title "FAA CACI: $COUNT worksheet(s) reissued — drop in new PDFs" \
            --body "$BODY" \
            --base main \
            --assignee ryancolby-pixel \
            --head "$BRANCH"

          printf '%s\n' "$BODY" > pr-alert-body.md
          ./scripts/send-alert-email.sh "PMG: FAA CACI worksheet(s) reissued" pr-alert-body.md

          # 🚨 EXIT 1 SO THE RUN GOES RED (added 2026-08-17). This and its HIMS sibling were
          # the only two alerting workflows with no failure backstop; every other one ends in
          # a "Fail the run ... so the owner is emailed" step. That matters because
          # send-alert-email.sh is FAIL-SOFT BY DESIGN - it warns and exits 0 on a missing
          # secret or an SMTP error - so without this line a reissued FAA worksheet could
          # produce a fully GREEN run that notified nobody at all. That is not hypothetical:
          # on 2026-08-03 the alert secrets did not yet exist, the HIMS job ran green, and
          # its PR sat unactioned for 14 days.
          echo "The FAA reissued $COUNT CACI worksheet PDF(s). See the pull request above."
          exit 1
